name: CI (Analyze & Test)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded 2>&1 | tee test_output.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-output
          path: test_output.txt